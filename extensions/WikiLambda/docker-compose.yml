services:
  function-orchestrator:
    image: docker-registry.wikimedia.org/repos/abstract-wiki/wikifunctions/function-orchestrator:latest
    # Un-comment this if you're using a local build, by running this in your check-out of the orchestrator:
    # docker build -f .pipeline/blubber.yaml --target development -t local-orchestrator .
    # image: local-orchestrator:latest
    # and set pull_policy to missing, since a local build can't be pulled
    pull_policy: daily
    ports:
      - 6254:6254
    environment:
      WIKI_API_URL: "http://mediawiki-web:8080/w/api.php"
      WIKIDATA_API_URL: "https://www.wikidata.org"
      ORCHESTRATOR_CONFIG: |
        {
          "evaluatorConfigs": [
            {
              "programmingLanguages": [
                "Z610",
                "Z611",
                "Z612",
                "Z613",
                "Z614",
                "Z615"
              ],
              "evaluatorUri": "http://mediawiki-function-evaluator-python-1:6927/1/v1/evaluate/",
              "evaluatorWs": "",
              "useReentrance": true
            },
            {
              "programmingLanguages": [
                "Z600",
                "Z601",
                "Z602",
                "Z603",
                "Z604",
                "Z605",
                "Z606",
                "Z607",
                "Z608"
              ],
              "evaluatorUri": "http://mediawiki-function-evaluator-javascript-1:6927/1/v1/evaluate/",
              "evaluatorWs": "",
              "useReentrance": true
            }
          ],
          "acceptCallbacks": true
        }
  function-evaluator-python:
    image: docker-registry.wikimedia.org/repos/abstract-wiki/wikifunctions/function-evaluator/rusty-py:latest
    # Un-comment this if you're using a local build, by running this in your check-out of the evaluator:
    # docker build -f .pipeline/blubber.yaml --target production-python3-rust-evaluator -t local-evaluator-py .
    # image: local-evaluator-py:latest
    # and set pull_policy to missing, since a local build can't be pulled
    pull_policy: daily
    ports:
      - 6928:6927
    environment:
      ORCHESTRATOR_CALLBACK_API_URI: "http://mediawiki-function-orchestrator-1:6254/1/v1/callback/"
  function-evaluator-javascript:
    image: docker-registry.wikimedia.org/repos/abstract-wiki/wikifunctions/function-evaluator/rusty-js:latest
    # Un-comment this if you're using a local build, by running this in your check-out of the evaluator:
    # docker build -f .pipeline/blubber.yaml --target production-javascript-rust-evaluator -t local-evaluator-js .
    # image: local-evaluator-js:latest
    # and set pull_policy to missing, since a local build can't be pulled
    pull_policy: daily
    ports:
      - 6929:6927
    environment:
      ORCHESTRATOR_CALLBACK_API_URI: "http://mediawiki-function-orchestrator-1:6254/1/v1/callback/"