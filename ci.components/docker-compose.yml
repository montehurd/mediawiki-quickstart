services:
  ci-components-results-server:
    image: node:24.22.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8088"
    ports:
      - 8088:8088
    volumes:
      - ./vue:/app
      # Outside Vite's root (/app): its dependency scan would read every results .html file
      - ${RESULTS_PATH:-./results}:/results:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - RESULTS_PATH=/results
      - NODE_OPTIONS=--max-old-space-size=4096
    restart: unless-stopped
